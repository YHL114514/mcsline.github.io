<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCS LINE · 饭制游戏官网</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }

    body {
      background: radial-gradient(circle at 30% 30%, #dbe6f0, #a8bccf, #6f8598);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1f2d3d;
      padding: 2rem 1.5rem;
      transition: all 0.5s ease;
    }

    /* ========== 默认主题（MCS LINE 原版） ========== */
    .game-container {
      max-width: 1200px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 3.5rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.25), 0 0 0 2px rgba(0, 183, 255, 0.1) inset;
      padding: 2.5rem 2rem;
      overflow: hidden;
      position: relative;
      transition: all 0.5s ease;
    }

    .line-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .line-bg span {
      position: absolute;
      background: linear-gradient(90deg, transparent, rgba(0, 183, 255, 0.4), transparent);
      width: 200%;
      height: 2px;
      filter: drop-shadow(0 0 6px rgba(0,183,255,0.7));
      animation: flow 8s linear infinite;
    }
    .line-bg span:nth-child(1) { top: 20%; left: -20%; animation-duration: 6s; }
    .line-bg span:nth-child(2) { top: 45%; left: -30%; animation-duration: 9s; animation-delay: 1.2s; }
    .line-bg span:nth-child(3) { top: 70%; left: -10%; animation-duration: 12s; animation-delay: 0.5s; }
    .line-bg span:nth-child(4) { top: 87%; left: -50%; animation-duration: 10s; animation-delay: 2s; }
    .line-bg span:nth-child(5) { top: 10%; left: -80%; animation-duration: 15s; animation-delay: 0.2s; }
    @keyframes flow { 0% { transform: translateX(0); } 100% { transform: translateX(60%); } }

    .content { position: relative; z-index: 10; }

    .logo-area { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .title-block { display: flex; align-items: center; gap: 15px; }

    .game-icon {
      width: 70px; height: 70px; border-radius: 20px;
      background: #e0f0ff; border: 2px solid #00b7ff;
      box-shadow: 0 5px 15px rgba(0, 183, 255, 0.4);
      object-fit: cover; display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; color: #0077b6;
    }

    .title-block h1 {
      font-size: 3.8rem; font-weight: 800; letter-spacing: 3px; line-height: 1;
      background: linear-gradient(135deg, #1f2d3d, #4c8fb5, #00b7ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.7);
      margin-bottom: 0.2rem;
    }

    .title-block .sub {
      font-size: 1.2rem; font-weight: 600; letter-spacing: 4px; color: #2c5c7a;
      text-transform: uppercase; border-bottom: 2px solid #00b7ff;
      display: inline-block; padding-bottom: 6px;
    }

    .badge-container { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .badge {
      background: rgba(44, 92, 122, 0.1); border-radius: 60px; padding: 0.6rem 1.5rem;
      border: 1px solid rgba(44, 92, 122, 0.3); font-weight: 600;
      backdrop-filter: blur(5px); font-size: 1rem; color: #1f4a66;
    }

    .author-row {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.7); padding: 5px 15px 5px 5px;
      border-radius: 50px; border: 1px solid #a3ceea;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .author-head {
      width: 42px; height: 42px; border-radius: 50%; border: 2px solid #00b7ff;
      background-color: #d0e8f5; object-fit: cover;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; color: #0e5f8a;
    }

    .author-name { font-weight: 700; color: #1f4a66; font-size: 1rem; letter-spacing: 1px; }

    .search-area { display: flex; justify-content: center; align-items: center; margin: 0.5rem 0 1.5rem; }
    .search-box {
      display: flex; align-items: center; background: rgba(255, 255, 255, 0.9);
      border: 2px solid #b0d4ec; border-radius: 60px; padding: 8px 20px;
      width: 100%; max-width: 480px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      transition: all 0.3s;
    }
    .search-box:focus-within { border-color: #00b7ff; box-shadow: 0 5px 20px rgba(0,183,255,0.2); }
    .search-box i { color: #6f9dbf; margin-right: 12px; font-size: 1.2rem; }
    .search-box input { border: none; outline: none; background: transparent; font-size: 1.1rem; width: 100%; color: #1f4a66; }

    .carousel-section { display: flex; justify-content: center; align-items: center; margin: 1.5rem 0 2.5rem; position: relative; }
    .carousel-container {
      position: relative; width: 100%; max-width: 800px;
      background: rgba(255, 255, 255, 0.7); border-radius: 2rem; padding: 1.2rem;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(0,183,255,0.2) inset;
      overflow: hidden; transition: all 0.5s ease;
    }
    .carousel-track { display: flex; transition: transform 0.5s ease; }
    .carousel-slide { min-width: 100%; padding: 0.5rem; }
    .preview-window {
      background: #f5f7fa; border-radius: 1.5rem; padding: 0.8rem;
      border: 2px solid #cde3f3; box-shadow: 0 0 25px rgba(0, 183, 255, 0.2);
      transition: all 0.5s ease;
    }
    .preview-window img { width: 100%; border-radius: 1rem; display: block; aspect-ratio: 16/9; object-fit: cover; background: #f0f4f8; border: 1px solid #b8d1e5; }

    .carousel-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.9); border: 2px solid #00b7ff;
      border-radius: 50%; width: 50px; height: 50px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 10; font-size: 1.4rem; color: #0077b6;
      box-shadow: 0 4px 12px rgba(0,183,255,0.3); transition: all 0.3s;
    }
    .carousel-btn:hover { background: #00b7ff; color: white; }
    .carousel-btn.prev { left: -20px; }
    .carousel-btn.next { right: -20px; }
    .carousel-dots { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
    .carousel-dot { width: 10px; height: 10px; border-radius: 50%; background: #a3ceea; cursor: pointer; transition: all 0.3s; }
    .carousel-dot.active { background: #00b7ff; transform: scale(1.2); }

    .warning-text {
      text-align: center; background: #fff3e0; border: 2px solid #ffb74d;
      color: #e65100; padding: 12px 20px; border-radius: 50px;
      font-weight: 700; font-size: 1.1rem; margin-bottom: 1.5rem;
      box-shadow: 0 4px 12px rgba(255, 152, 0, 0.2); transition: all 0.5s ease;
    }

    .download-section {
      background: rgba(255, 255, 255, 0.85); border-radius: 2.5rem; padding: 2rem 2.2rem;
      border: 1px solid #b0d4ec; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      margin-bottom: 1rem; transition: all 0.5s ease;
    }
    .download-section h2 { font-size: 2rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 10px; color: #1f4a66; }
    .link-cards { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; }

    .card-link {
      flex: 1 1 250px; max-width: 350px;
      background: #f8fcff; border-radius: 2rem; padding: 1.6rem 1.2rem;
      text-decoration: none; color: #1f4a66; border: 2px solid #a3ceea;
      transition: transform 0.3s ease, box-shadow 0.3s;
      box-shadow: 0 10px 20px -8px rgba(31, 74, 102, 0.3);
      backdrop-filter: blur(5px); display: block;
    }
    .card-link:hover { transform: translateY(-8px); box-shadow: 0 25px 35px -8px rgba(31, 74, 102, 0.4), 0 0 20px rgba(0,183,255,0.5); border-color: #00b7ff; background: #ffffff; }
    .card-link .icon-big { font-size: 2.8rem; margin-bottom: 0.8rem; color: #0090d8; }
    .card-link .link-title { font-size: 1.5rem; font-weight: 700; letter-spacing: 1px; display: block; margin-bottom: 0.4rem; }
    .card-link .link-desc { font-size: 0.9rem; opacity: 0.8; word-break: break-all; color: #3c6e8f; border-top: 1px solid #cde3f3; padding-top: 0.8rem; margin-top: 0.5rem; }

    .copy-btn {
      background: #e8f3fb; border: none; border-radius: 40px; padding: 8px 16px;
      font-size: 0.85rem; font-weight: 600; color: #0077b6; cursor: pointer;
      transition: all 0.2s; margin-top: 12px; display: inline-flex;
      align-items: center; gap: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .copy-btn:hover { background: #d3e9f7; color: #005a8a; }
    .copy-btn.copied { background: #dcf3e4; color: #2eaf6e; }

    .card-static { cursor: default; }
    .card-static:hover { transform: translateY(-8px); box-shadow: 0 25px 35px -8px rgba(31, 74, 102, 0.4), 0 0 20px rgba(0,183,255,0.5); border-color: #00b7ff; background: #ffffff; }

    .card-link.mc-server { background: linear-gradient(145deg, #eaf7ef, #dcf3e4); border-color: #76c7a0; }
    .card-link.mc-server:hover { border-color: #2eaf6e; }
    .card-link.mc-server .icon-big { color: #2eaf6e; }
    .card-link.qq-group .icon-big { color: #e67e22; }
    .card-link.direct-download { background: linear-gradient(145deg, #fff0e6, #ffe6d5); border-color: #ff9f68; }
    .card-link.direct-download:hover { border-color: #ff7a3c; }
    .card-link.direct-download .icon-big { color: #ff7a3c; }

    .footer-note {
      margin-top: 2.5rem; text-align: center; font-size: 0.8rem; color: #397d9f;
      border-top: 1px solid rgba(44, 92, 122, 0.2); padding-top: 1.5rem;
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      transition: all 0.5s ease;
    }
    .footer-note .mcs { font-weight: 600; color: #1f4a66; }
    .footer-note i { margin: 0 5px; color: #00a2e8; }

    /* ========== 67 抖动动画 ========== */
    @keyframes chromeShake {
      0% { transform: translateX(0); }
      10% { transform: translateX(-12px) rotate(-0.5deg); }
      20% { transform: translateX(10px) rotate(0.5deg); }
      30% { transform: translateX(-8px); }
      40% { transform: translateX(6px); }
      50% { transform: translateX(-4px); }
      60% { transform: translateX(4px); }
      70% { transform: translateX(-2px); }
      80% { transform: translateX(2px); }
      90% { transform: translateX(-1px); }
      100% { transform: translateX(0); }
    }
    .shake-active { animation: chromeShake 0.4s linear infinite; }

    /* ========== Minecraft / MCBBS 主题 ========== */
    body.minecraft-theme { background: #5b4a3f; background-image: linear-gradient(45deg, #7a6a5a 25%, transparent 25%), linear-gradient(-45deg, #7a6a5a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #7a6a5a 75%), linear-gradient(-45deg, transparent 75%, #7a6a5a 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0px; font-family: 'Courier New', monospace; }
    body.minecraft-theme .game-container { background: rgba(60, 50, 40, 0.95); border: 4px solid #3d2e1e; box-shadow: 8px 8px 0px rgba(0,0,0,0.5); border-radius: 0; color: #e8d8b0; }
    body.minecraft-theme h1 { font-family: 'Courier New', monospace; color: #8b8b8b !important; text-shadow: 2px 2px #3d3d3d; -webkit-text-fill-color: #8b8b8b; letter-spacing: 1px; }
    body.minecraft-theme .sub { color: #55aa55 !important; border-bottom-color: #55aa55; }
    body.minecraft-theme .badge { background: #3d2e1e; border: 2px solid #6a5a4a; color: #c8b898; font-family: 'Courier New', monospace; }
    body.minecraft-theme .author-row { background: #3d2e1e; border: 2px solid #6a5a4a; }
    body.minecraft-theme .author-name { color: #e8d8b0; }
    body.minecraft-theme .search-box { background: #2d2d2d; border: 3px solid #555; border-radius: 0; box-shadow: inset 2px 2px 4px rgba(0,0,0,0.5); }
    body.minecraft-theme .search-box input { color: #e8d8b0; font-family: 'Courier New', monospace; }
    body.minecraft-theme .carousel-container { background: rgba(60, 50, 40, 0.9); border: 3px solid #3d2e1e; border-radius: 0; box-shadow: 4px 4px 0px rgba(0,0,0,0.5); }
    body.minecraft-theme .preview-window { background: #2d2d2d; border: 3px solid #555; border-radius: 0; }
    body.minecraft-theme .carousel-btn { background: #3d2e1e; border: 3px solid #6a5a4a; border-radius: 0; color: #e8d8b0; }
    body.minecraft-theme .carousel-btn:hover { background: #6a5a4a; color: white; }
    body.minecraft-theme .carousel-dot { background: #6a5a4a; border: 2px solid #3d2e1e; border-radius: 0; }
    body.minecraft-theme .carousel-dot.active { background: #55aa55; border-color: #55aa55; }
    body.minecraft-theme .warning-text { background: #3d2e1e; border: 3px solid #ff5555; border-radius: 0; color: #ff5555; font-family: 'Courier New', monospace; }
    body.minecraft-theme .download-section { background: rgba(60, 50, 40, 0.95); border: 3px solid #3d2e1e; border-radius: 0; box-shadow: 4px 4px 0px rgba(0,0,0,0.5); }
    body.minecraft-theme .download-section h2 { color: #e8d8b0; }
    body.minecraft-theme .card-link { background: #3d2e1e; border: 3px solid #6a5a4a; border-radius: 0; color: #e8d8b0; box-shadow: 4px 4px 0px rgba(0,0,0,0.4); font-family: 'Courier New', monospace; }
    body.minecraft-theme .card-link:hover { border-color: #55aa55; background: #4d3e2e; }
    body.minecraft-theme .card-link.direct-download { background: linear-gradient(145deg, #5a4a3a, #4d3e2e); border-color: #c8a04a; }
    body.minecraft-theme .card-link.direct-download:hover { border-color: #55aa55; }
    body.minecraft-theme .card-link.qq-group .icon-big { color: #ff5555; }
    body.minecraft-theme .card-link.mc-server { background: linear-gradient(145deg, #4a3a2e, #3d2e1e); border-color: #55aa55; }
    body.minecraft-theme .card-link.mc-server:hover { border-color: #6ae06a; }
    body.minecraft-theme .card-link.mc-server .icon-big { color: #55aa55; }
    body.minecraft-theme .copy-btn { background: #2d2d2d; border: 2px solid #555; border-radius: 0; color: #e8d8b0; }
    body.minecraft-theme .copy-btn:hover { background: #4d3e2e; border-color: #55aa55; }
    body.minecraft-theme .footer-note { color: #a89880; border-top-color: #6a5a4a; }
    body.minecraft-theme .footer-note .mcs { color: #c8b898; }
    body.minecraft-theme .line-bg span { background: linear-gradient(90deg, transparent, rgba(85, 170, 85, 0.4), transparent); }
    body.minecraft-theme .game-icon { background: #3d2e1e; border: 3px solid #6a5a4a; border-radius: 0; }
    body.minecraft-theme .author-head { background: #3d2e1e; border: 2px solid #6a5a4a; border-radius: 0; }

  <script>
    function copyText(btn, text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showCopied(btn)).catch(() => fallbackCopy(btn, text));
      } else { fallbackCopy(btn, text); }
    }
    function fallbackCopy(btn, text) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta); showCopied(btn);
    }
    function showCopied(btn) {
      const orig = btn.innerHTML;
      btn.classList.add('copied'); btn.innerHTML = '<i class="fas fa-check"></i> 已复制';
      setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
    }

    const searchInput = document.getElementById('secretSearch');
    const mainContainer = document.getElementById('mainContainer');

    searchInput.addEventListener('input', function() {
      const value = this.value.trim().toLowerCase();

      // 67 彩蛋
      if (value === '67' || value === 'six seven' || value === 'sixseven' || value === 'six  seven') {
        triggerShake();
      }

      // 清除所有主题
      document.body.classList.remove('minecraft-theme', 'backrooms-theme', 'phigros-theme', 'msdos-theme');

      // 切换主题（持续保持）
      if (value === 'minecraft') document.body.classList.add('minecraft-theme');
      else if (value === 'backrooms') document.body.classList.add('backrooms-theme');
      else if (value === 'phigros') document.body.classList.add('phigros-theme');
      else if (value === 'msdos') document.body.classList.add('msdos-theme');
    });

    function triggerShake() {
      if (mainContainer.classList.contains('shake-active')) return;
      mainContainer.classList.add('shake-active');
      setTimeout(() => mainContainer.classList.remove('shake-active'), 3000);
    }

    // 轮播图
    let currentSlide = 0;
    const track = document.getElementById('carouselTrack');
    const dots = document.querySelectorAll('.carousel-dot');
    const totalSlides = 3;

    function goToSlide(index) {
      currentSlide = index;
      track.style.transform = `translateX(-${currentSlide * 100}%)`;
      dots.forEach((dot, i) => dot.classList.toggle('active', i === currentSlide));
    }
    function moveSlide(direction) {
      currentSlide = (currentSlide + direction + totalSlides) % totalSlides;
      goToSlide(currentSlide);
    }
    setInterval(() => moveSlide(1), 5000);

    // BGM
    const bgm = document.getElementById('bgm');
    bgm.play().catch(() => {
      document.addEventListener('click', function unlock() {
        bgm.play(); document.removeEventListener('click', unlock);
      });
    });
  </script>
